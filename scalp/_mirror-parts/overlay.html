  var EN={}, PL={};
  Object.keys(MAP).forEach(function(k){ EN[k]=MAP[k]; PL[MAP[k]]=k; });
  var nodes=[];
  (function walk(el){
    for(var n=el.firstChild;n;n=n.nextSibling){
      if(n.nodeType===3){
        var t=n.nodeValue.trim();
        if(t && (EN[t]||PL[t])) nodes.push(n);
      } else if(n.nodeType===1 && !/^(SCRIPT|STYLE)$/.test(n.tagName) && n.id!=='langbar'){
        walk(n);
      }
    }
  })(document.body);
  function setLang(to){
    nodes.forEach(function(n){
      var t=n.nodeValue.trim(), pre=n.nodeValue.match(/^\s*/)[0], post=n.nodeValue.match(/\s*$/)[0];
      var v = to==='en' ? EN[t] : PL[t];
      if(v) n.nodeValue = pre+v+post;
    });
    document.documentElement.lang = to;
    // el chat sigue al idioma de la pestaña
    try{
      var M=window.__CHAT_EN__;
      if(M && window.__KALMELY_FAQ__){
        window.__KALMELY_FAQ__.forEach(function(f){
          if(to==='en'){ if(M.q[f.q]){f._qpl=f.q; f.q=M.q[f.q];} if(M.a[f.a]){f._apl=f.a; f.a=M.a[f.a];} }
          else { if(f._qpl){f.q=f._qpl;} if(f._apl){f.a=f._apl;} }
        });
      }
      var log=document.getElementById('chatLog');
      if(log && log.firstChild && M){
        var g=log.querySelector('.msg.bot');
        if(g){ g.textContent = (to==='en') ? M.greet : 'Cześć! Jestem tu z ramienia zespołu Kalmely. Pytaj śmiało o kostkę, swoje zamówienie albo o 60-dniową gwarancję.'; }
      }
      var qb=document.getElementById('chatQuick');
      if(qb && qb.children.length && window.__KALMELY_RENDERQUICK__) window.__KALMELY_RENDERQUICK__();
    }catch(e){}
    document.getElementById('btnPL').classList.toggle('on', to==='pl');
    document.getElementById('btnEN').classList.toggle('on', to==='en');
    if(!FORCED){try{localStorage.setItem('kalmely_mirror_lang',to);}catch(e){}}
  }
  document.getElementById('btnPL').onclick=function(){setLang('pl');};
  document.getElementById('btnEN').onclick=function(){setLang('en');};
  var hl=false;
  document.getElementById('btnHL').onclick=function(){
    hl=!hl; this.classList.toggle('on',hl);
    nodes.forEach(function(n){
      var p=n.parentElement; if(!p)return;
      if(hl) p.setAttribute('data-i18n-hl','1'); else p.removeAttribute('data-i18n-hl');
    });
  };
  document.getElementById('langHint').textContent = nodes.length+' textos encontrados en la página · esta barra no existe en producción';
  // ?lang=en / ?lang=pl fija el idioma de ESTA pestaña y no toca el localStorage,
  // para poder tener las dos abiertas a la vez sin que se pisen.
  if(FORCED){
    setLang(FORCED);
    document.getElementById('langHint').textContent =
      'Pestaña fijada en ' + (FORCED==='en'?'INGLÉS':'POLACO') + ' · los botones siguen funcionando';
  } else {
    try{ if(localStorage.getItem('kalmely_mirror_lang')==='en') setLang('en'); }catch(e){}
  }
})();
