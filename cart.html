<!DOCTYPE html>
<html lang="en-GB">
<head>
<!-- Persist Meta click-id: _fbc from ?fbclid + _fbp, so Pixel & CAPI always have them (even if the Pixel is blocked/deferred) -->
<script type="text/javascript">
  (function(){try{
    function gc(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?m[1]:'';}
    function sc(n,v){document.cookie=n+'='+v+'; max-age=7776000; path=/; SameSite=Lax';}
    var cid=new URLSearchParams(location.search).get('fbclid');
    if(cid && !gc('_fbc')) sc('_fbc','fb.1.'+Date.now()+'.'+cid);
    if(!gc('_fbp')) sc('_fbp','fb.1.'+Date.now()+'.'+Math.floor(Math.random()*1e10));
  }catch(e){}})();
</script>
<!-- Microsoft Clarity — skipped in admin mode (cookie kalmely_admin / ?admin_mode) so own visits don't pollute recordings -->
<script type="text/javascript">
  (function(){
    var isAdmin = document.cookie.indexOf('kalmely_admin=true') !== -1
      || new URLSearchParams(location.search).get('admin_mode') === 'kalmely_julio_2026';
    if (isAdmin) return;
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x4mat5v5ce");
  })();
</script>
<meta charset="UTF-8">
<title>Kalmely</title>
<meta name="robots" content="noindex, nofollow">
<!-- The old cart/summary page is retired. The store checks out directly from the
     landing into Stripe, so any hit here (old links, Stripe back/cancel) goes home. -->
<meta http-equiv="refresh" content="0; url=/">
<script>location.replace('/');</script>
</head>
<body></body>
</html>
